# This workflow will build a package using Maven and then publish it to Repolite repository
# For more information see: https://github.com/actions/setup-java/blob/main/docs/advanced-usage.md

name: Maven Package

on:
  release:
    types: [created]
  push:
    branches: [main]

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Create settings.xml for Repolite
      run: |
        mkdir -p ~/.m2
        cat > ~/.m2/settings.xml << 'EOF'
        <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                  xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                  xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0
                                      https://maven.apache.org/xsd/settings-1.0.0.xsd">
          <servers>
            <server>
              <id>repolite-releases</id>
              <username>${env.REPOLITE_USERNAME}</username>
              <password>${env.REPOLITE_PASSWORD}</password>
            </server>
            <server>
              <id>repolite-snapshots</id>
              <username>${env.REPOLITE_USERNAME}</username>
              <password>${env.REPOLITE_PASSWORD}</password>
            </server>
          </servers>
        </settings>
        EOF
      env:
        REPOLITE_USERNAME: ${{ secrets.REPOLITE_USERNAME }}
        REPOLITE_PASSWORD: ${{ secrets.REPOLITE_PASSWORD }}

    - name: Build with Maven
      run: mvn -B package --file pom.xml

    - name: Deploy to Repolite Repository
      run: mvn deploy
      env:
        REPOLITE_USERNAME: ${{ secrets.REPOLITE_USERNAME }}
        REPOLITE_PASSWORD: ${{ secrets.REPOLITE_PASSWORD }}

    - name: Send Discord notification
      uses: ./.github/actions/send-discord-notification
      if: always()
      with:
        webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}
        status: ${{ job.status }}
        run-name: ${{ format('spring-boot-base | {0}', github.ref_name) }}